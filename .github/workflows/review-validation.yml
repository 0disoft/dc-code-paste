name: Review Integration Validation

on:
  push:
    branches:
      - review/integration-validation-2026-09-23
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-integration-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Svelte check
        run: bun run check
      - name: TypeScript check
        run: bun run typecheck:go
      - name: Lint
        run: bun run lint
      - name: Formatting diagnostics
        id: formatting
        continue-on-error: true
        run: |
          if ! bun run format:check; then
            bun run format
            git diff
            git checkout -- .
            exit 1
          fi
      - name: Unit tests
        run: bun run test --run
      - name: Pages build
        env:
          BASE_PATH: /dc-code-paste
        run: bun run build
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Browser tests
        run: bun run test:e2e
      - name: Enforce formatting result
        if: steps.formatting.outcome == 'failure'
        run: exit 1
